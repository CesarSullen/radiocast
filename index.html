<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"

		<meta property="og:title" content="RadioCast" />
		<meta property="og:type" content="website" />

		<meta name="mobile-web-app-capable" content="yes" />

		<link rel="manifest" href="./manifest.json" />

	</head>

		<audio id="radioPlayer" preload="none" class="hidden">

				<div class="controls">
					<div class="segmented" id="segmented" data-view="stations" role="tablist">
						<span class="segmented-thumb" aria-hidden="true"></span>
						<button type="button" class="segment selected" role="tab" aria-selected="true" data-action="set-view" data-view="stations">
							<span class="icon i-tower" aria-hidden="true"></span>
							<span>Stations</span>
						</button>
						<button type="button" class="segment" role="tab" aria-selected="false" data-action="set-view" data-view="favs">
							<span class="icon i-heart" aria-hidden="true"></span>
							<span>Favorites</span>
						</button>
					</div>

					<button type="button" class="sleep-btn" data-action="open-sleep" aria-label="Sleep timer">
						<span class="icon i-moon" aria-hidden="true"></span>
						<span class="sleep-time"></span>
					</button>
				</div>
			</header>

			<main class="stage">
				<section class="view" id="stationsView" aria-label="Stations">
					<div class="carousel" id="stationsList"></div>
					<div class="dots" id="stationsDots" aria-hidden="true"></div>
				</section>

				<section class="view hidden" id="favsView" aria-label="Favorites">
					<div class="carousel" id="favsList"></div>
					<div class="dots" id="favsDots" aria-hidden="true"></div>
				</section>
			</main>

			<footer>
				<nav class="footer-links">
					<a href="https://cesarsullen.github.io">About the Developer</a>
					<a href="https://cesarsullen.github.io/views/pwa-install">How to Install?</a>
					<a href="https://cesarsullen.github.io/views/donations">Support Me</a>
					<a href="https://de1.api.radio-browser.info/" target="_blank" rel="noopener">Radio Browser API</a>
				</nav>
				<p class="app-version">RadioCast v1.1.1</p>
			</footer>
		</div>

		<div class="mini-player" id="miniPlayer">
			<button type="button" class="mini-open" data-action="open-player" aria-label="Open player">
				<img class="player-cover mini-thumb" src="./assets/icon-512.png" alt="" />
				<span class="mini-text">
					<span class="mini-name" data-bind="name"></span>
					<span class="player-status" data-bind="status" role="status"></span>
				</span>
			</button>
			<button type="button" class="icon-btn mini-expand" data-action="open-player" aria-label="Open player">
				<span class="icon i-caret-up" aria-hidden="true"></span>
			</button>

			<div class="mini-controls">
				<div class="live-indicator">
					<span class="icon i-tower" aria-hidden="true"></span>
					<span>LIVE</span>
				</div>
				<div class="transport">
					<button type="button" class="icon-btn" data-action="prev" aria-label="Previous station">
						<span class="icon i-prev" aria-hidden="true"></span>
					</button>
					<button type="button" class="play-circle play-toggle" data-action="toggle-play" aria-label="Play">
						<span class="icon i-play" aria-hidden="true"></span>
						<span class="icon i-pause" aria-hidden="true"></span>
					</button>
					<button type="button" class="icon-btn" data-action="next" aria-label="Next station">
						<span class="icon i-next" aria-hidden="true"></span>
					</button>
				</div>
				<button type="button" class="icon-btn fav-btn" data-action="fav" aria-label="Add to favorites">
					<span class="icon i-heart" aria-hidden="true"></span>
				</button>
			</div>
		</div>

		<div class="full-player" id="fullPlayer" aria-hidden="true">
			<div class="full-inner">
				<div class="full-top">
					<button type="button" class="icon-btn" data-action="close-player" aria-label="Close player">
						<span class="icon i-caret-down" aria-hidden="true"></span>
					</button>
					<button type="button" class="icon-btn fav-btn" data-action="fav" aria-label="Add to favorites">
						<span class="icon i-heart" aria-hidden="true"></span>
					</button>
				</div>

				<div class="full-cover-wrap">
					<img class="player-cover full-cover" src="./assets/icon-512.png" alt="Station cover" />
				</div>

				<div class="live-pill">
					<span class="icon i-tower" aria-hidden="true"></span>
					<span>LIVE</span>
				</div>
				<h2 class="full-name" data-bind="name"></h2>
				<p class="player-status" data-bind="status" role="status"></p>

				<div class="full-controls">
					<button type="button" class="sleep-btn sleep-btn--full" data-action="open-sleep" aria-label="Sleep timer">
						<span class="icon i-moon" aria-hidden="true"></span>
						<span class="sleep-text">Sleep</span>
						<span class="sleep-time"></span>
						<span class="icon icon-sm i-caret-down" aria-hidden="true"></span>
					</button>
					<div class="transport">
						<button type="button" class="icon-btn icon-btn--big" data-action="prev" aria-label="Previous station">
							<span class="icon i-prev" aria-hidden="true"></span>
						</button>
						<button type="button" class="play-circle play-circle--big play-toggle" data-action="toggle-play" aria-label="Play">
							<span class="icon i-play" aria-hidden="true"></span>
							<span class="icon i-pause" aria-hidden="true"></span>
						</button>
						<button type="button" class="icon-btn icon-btn--big" data-action="next" aria-label="Next station">
							<span class="icon i-next" aria-hidden="true"></span>
						</button>
					</div>
				</div>
			</div>
		</div>

		<div class="sheet" id="sleepSheet" aria-hidden="true">
			<div class="sheet-backdrop" data-action="close-sleep"></div>
			<div class="sheet-panel" role="dialog" aria-label="Sleep timer">
				<p class="sheet-title">Sleep timer</p>
				<div class="sleep-options" id="sleepOptions"></div>
			</div>
		</div>

		<script src="./js/supabase-config.js"></script>
		<script src="./js/stations.js"></script>
		<script src="./js/main.js"></script>
	</body>
</html>
